name: edutech-admin
services:
  app:
    build: { context: ., target: development }
    volumes: [.:/var/www/html]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [edutech]
  nginx:
    image: nginx:1.28-alpine
    ports: ["8092:80"]
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [app]
    networks: [edutech]
  queue:
    build: { context: ., target: development }
    command: php artisan queue:work --sleep=2 --tries=3 --timeout=90
    volumes: [.:/var/www/html]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [edutech]
  scheduler:
    build: { context: ., target: development }
    command: php artisan schedule:work
    volumes: [.:/var/www/html]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [edutech]
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-edutech}
      POSTGRES_USER: ${DB_USERNAME:-edutech}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-edutech_secret}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [edutech]
  redis:
    image: redis:8-alpine
    command: redis-server --appendonly yes
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [edutech]
volumes:
  postgres_data:
  redis_data:
networks:
  edutech:
    driver: bridge
