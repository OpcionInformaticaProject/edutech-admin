name: edutech-admin-production
services:
  app:
    build: { context: ., target: production }
    env_file: .env.production
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    volumes: [app_storage:/var/www/html/storage]
    networks: [edutech]
    healthcheck:
      test: ["CMD", "php-fpm", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
  nginx:
    build: { context: ., target: nginx }
    restart: unless-stopped
    ports: ["127.0.0.1:8092:80"]
    depends_on:
      app: { condition: service_healthy }
    volumes: [app_storage:/var/www/html/storage:ro]
    networks: [edutech]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/up"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
  queue:
    build: { context: ., target: production }
    command: php artisan queue:work --sleep=2 --tries=3 --timeout=90
    env_file: .env.production
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    volumes: [app_storage:/var/www/html/storage]
    networks: [edutech]
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'artisan queue:work' >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
  scheduler:
    build: { context: ., target: production }
    command: php artisan schedule:work
    env_file: .env.production
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    volumes: [app_storage:/var/www/html/storage]
    networks: [edutech]
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'artisan schedule:work' >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:?Define DB_DATABASE in .env.production}
      POSTGRES_USER: ${DB_USERNAME:?Define DB_USERNAME in .env.production}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD in .env.production}
    restart: unless-stopped
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [edutech]
  redis:
    image: redis:8-alpine
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?Define REDIS_PASSWORD in .env.production}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Define REDIS_PASSWORD in .env.production}
    restart: unless-stopped
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping | grep PONG"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [edutech]
volumes:
  app_storage:
  postgres_data:
  redis_data:
networks:
  edutech:
    driver: bridge
